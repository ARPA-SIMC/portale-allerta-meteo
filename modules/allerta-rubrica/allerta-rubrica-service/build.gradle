dependencies {
	api project(":modules:allerta-rubrica:allerta-rubrica-api")

	compileOnly group: "com.liferay.portal", name: "release.dxp.api"
	
	compileOnly group: "com.liferay", name: "com.liferay.petra.lang"
	compileOnly group: "com.liferay", name: "com.liferay.petra.string"
	compileOnly group: "com.liferay", name: "com.liferay.portal.aop.api"
	
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel"
	

	compileOnly group: "org.osgi", name: "org.osgi.core"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations"
	
	compileOnly 'biz.aQute.bnd:biz.aQute.bnd.annotation:4.2.0'
	compileOnly group: "com.liferay", name: "com.liferay.portal.spring.extender", version: "2.0.0"
	
	
	compileInclude group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.0.1'
	compileInclude group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.0.1'
	compileInclude group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.0.1'
	compileInclude group: 'org.apache.commons', name: 'commons-lang3', version: '3.9'
	compileInclude group: 'commons-codec', name: 'commons-codec', version: '1.4' 
	compileInclude group: 'org.apache.commons', name: 'commons-collections4', version: '4.0'
	//compileInclude group: 'commons-logging', name: 'commons-logging', version: '1.1.1'

	compileOnly project(":modules:allerta-base")
}

buildService {
	apiDir = "../allerta-rubrica-api/src/main/java"
	testDir = "../allerta-rubrica-test/src/testIntegration/java"
	databaseNameMaxLength = 50
}

group = "it.eng.rubrica"