allertaanimazionemeteo_nowcasting=La mappa evoluzione considera gli echi delle precipitazioni ad un dato istante e fornisce la previsione del loro spostamento a +1 ora (linea gialla), +2 ore (linea arancione) e +3 ore (linea rossa): in caso di situazione stazionaria la linea rossa ricopre le altre. Gli echi sono rappresentati in modo semplificato con due o tre diversi colori, dalle tonalit&agrave; pi&ugrave; scure per nubi debolmente precipitanti a colori pi&ugrave; chiari per le precipitazioni pi&ugrave; intense. 