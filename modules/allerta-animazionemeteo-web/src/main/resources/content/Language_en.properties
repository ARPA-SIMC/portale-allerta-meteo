allertaanimazionemeteo_nowcasting=The evolutionary map displays the echoes of precipitations in a given instant and provides a prediction of their movement in the next +1 hour (yellow line), +2 hours (orange line) and +3 hours (red line): if the situation is stationary, the red line will cover the others. Echoes are represented in a simplified way with two or three different colors, ranging from darker tones for weakly precipitating clouds to lighter tones for more intense precipitations. 