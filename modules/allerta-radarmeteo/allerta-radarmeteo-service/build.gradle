dependencies {
	api project(":modules:allerta-radarmeteo:allerta-radarmeteo-api")

	compileOnly group: "com.liferay.portal", name: "release.dxp.api"
		
	compileOnly group: "com.liferay", name: "com.liferay.petra.lang"
	compileOnly group: "com.liferay", name: "com.liferay.petra.string"
	compileOnly group: "com.liferay", name: "com.liferay.portal.aop.api"
	compileOnly group: "com.liferay.portal", name: "com.liferay.util.java"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel"
	compileOnly group: "org.osgi", name: "org.osgi.core"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations"
	
	compileOnly 'biz.aQute.bnd:biz.aQute.bnd.annotation:4.2.0'
	compileOnly group: "com.liferay", name: "com.liferay.portal.spring.extender", version: "2.0.0"
	compileOnly group: "com.liferay", name: "com.liferay.petra.string"
	
	compileOnly 'com.liferay:com.liferay.portal.upgrade.api:2.0.0'
	
	
}

buildService {
	apiDir = "../allerta-radarmeteo-api/src/main/java"
	testDir = "../allerta-radarmeteo-test/src/testIntegration/java"
}

group = "it.eng.radarMeteo"